# Render 部署配置文件
services:
  - type: web
    name: staff-clinic
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: INIT_ADMIN_USERNAME
        value: admin
      - key: INIT_ADMIN_PASSWORD
        value: Admin@2026
      - key: BCRYPT_ROUNDS
        value: 10
      - key: NODE_VERSION
        value: "20"
